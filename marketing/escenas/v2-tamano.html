<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/brand.css"><style>
.big { position:absolute; left:40px; right:40px; top:96px; font-size:52px; text-shadow:0 2px 18px rgba(0,0,0,.45); }

.dim::before { top:0 } .dim::after { bottom:0 }
.dimlab { position:absolute; font-weight:800; font-size:26px; background:rgba(14,16,20,.82); border:1px solid rgba(236,231,220,.3); padding:6px 14px; border-radius:999px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.coin { position:absolute; width:73px; height:73px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #f1dc9a, #c9a24e 60%, #8d6a26); box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 0 0 5px rgba(255,255,255,.18); display:grid; place-items:center; }
.coin i { width:47px; height:47px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #f4f4f6, #b9bcc4 70%, #8a8d96); display:grid; place-items:center; font-style:normal; font-weight:800; font-size:21px; color:#4a4d58; box-shadow:inset 0 0 0 2px rgba(0,0,0,.12); }
</style></head><body><div class="stage" style="width:540px;height:960px">

"246.7" y1="227.5" x2="189.6" y2="51.5" stroke="#161616" stroke-width="1.08" stroke-linecap="round" opacity="0.8"/><line x1="265.3" y1="227.5" x2="322.4" y2="51.5" stroke="#161616" stroke-width="1.08" stroke-linecap="round" opacity="0.8"/><line x1="280.3" y1="238.4" x2="429.9" y2="129.6" stroke="#161616" stroke-width="1.08" stroke-linecap="round" opacity="0.8"/><circle cx="256" cy="256" r="14" fill="#161616" stroke="#161616" stroke-width="1.8"/></svg></div>
  <div class="dim" id="dim"></div><div class="dimlab" id="dimlab"></div>
  <div class="coin" id="coin" style="left:264px;top:620px"><i>2 €</i></div>
  <div class="chip" id="coinlab" style="position:absolute;left:30px;top:830px">Moneda de 2 €: 2,6 cm</div>
  <div class="big display" id="title">Lo que nadie te dice del tamaño de un tatuaje</div>
  <div class="capt display" id="c1" style="opacity:0">3 cm: apenas más que una moneda.</div>
  <div class="capt display" id="c2" style="opacity:0">5 cm: ya se nota.</div>
  <div class="capt display" id="c3" style="opacity:0">8 cm: casi todo el ancho del antebrazo.</div>
  <div id="veil" class="abs" style="inset:0;background:#0e1014;opacity:0"></div>
  <div class="big display" id="end" style="opacity:0;top:110px">Verlo antes lleva 30 segundos.<br><span style="color:#a58bff;font-size:40px">Cambiarlo después, bastante más.</span></div>
  <div class="chip" id="basis" style="position:absolute;right:30px;top:830px;opacity:0;font-size:15px">Antebrazo de 9 a 10 cm de ancho</div>
  <div class="abs" id="tag" style="left:40px;right:40px;bottom:70px;opacity:0;display:flex;justify-content:space-between;align-items:center">
    <span class="chip">Simulación con IA</span>
    <span class="brand"><svg width="30" height="30" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.4" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.6" fill="#a58bff"/></svg><span>Calco</span></span>
  </div>
  <div class="abs" id="fade" style="inset:0;background:#0e1014"></div>
<div style="position:absolute;right:22px;bottom:22px;z-index:99;display:flex;align-items:center;gap:7px;opacity:.9;pointer-events:none"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.4" fill="#a58bff"/></svg><span style="font-family:Gloock,serif;font-size:22px;color:#ece7dc;text-shadow:0 1px 8px rgba(0,0,0,.6)">Calco</span></div></div>
<script src="../lib/anim.js"></script><script>
window.DURATION = 18;
const $ = (id) => document.getElementById(id);
const PX = 28, CX = 300, CY = 400;                           // 28 px = 1 cm (el antebrazo mide ~9,5 cm de ancho en la foto)
const svgEl = $("tat").querySelector("svg");
const bb = svgEl.getBBox(); const RATIO = Math.max(bb.width, bb.height) / 512; // fracción del lienzo que ocupa el dibujo (medida real)
const ink = new Ink(svgEl, { boost: 1.6 });
const fmt = (cm) => cm.toFixed(1).replace(".", ",");
window.render = (t) => {
  $("fade").style.opacity = Math.max(1 - E.out(seg(t, 0, 0.5)), E.in(seg(t, 17.5, 18)));
  reveal($("title"), t, 0.4, 1.2); $("title").style.opacity = Math.min(+$("title").style.opacity, 1 - seg(t, 2.8, 3.2));
  // tamaño en cm: 3 -> 5 -> 8
  let cm = 3;
  if (t > 6.2) cm = t < 7.6 ? lerp(3, 5, E.io(seg(t, 6.2, 7.6))) : 5;
  if (t > 9.6) cm = t < 11.0 ? lerp(5, 8, E.io(seg(t, 9.6, 11.0))) : 8;
  const d = cm * PX, size = d / RATIO;
  const tat = $("tat"); tat.style.width = tat.style.height = size + "px"; tat.style.left = CX - size / 2 + "px"; tat.style.top = CY - size / 2 + "px";
  ink.set(E.io(seg(t, 3.4, 5.0)), E.soft(seg(t, 5.0, 5.8)));
  // cota
  const dimOp = E.soft(seg(t, 5.0, 5.5)) * (1 - E.soft(seg(t, 14.0, 14.4)));
  const dim = $("dim"); dim.style.opacity = dimOp; dim.style.left = CX + d / 2 + 16 + "px"; dim.style.top = CY - d / 2 + "px"; dim.style.height = d + "px";
  const lab = $("dimlab"); lab.style.opacity = dimOp; lab.textContent = fmt(cm) + " cm"; lab.style.left = CX - 52 + "px"; lab.style.top = CY + d / 2 + 14 + "px";
  // moneda de referencia
  const cp = E.back(seg(t, 3.4, 4.0));
  $("coin").style.opacity = seg(t, 3.4, 3.7) * (1 - E.soft(seg(t, 14.0, 14.4))); $("coin").style.transform = `scale(${cp})`;
  $("coinlab").style.opacity = seg(t, 3.8, 4.2) * (1 - E.soft(seg(t, 14.0, 14.4)));
  $("basis").style.opacity = seg(t, 4.2, 4.8) * (1 - E.soft(seg(t, 14.0, 14.4)));
  // subtítulos
  const cap = (id, a, b) => { const el = $(id); reveal(el, t, a, a + 0.5, { dy: 12 }); el.style.opacity = Math.min(+el.style.opacity, 1 - seg(t, b, b + 0.4)); };
  cap("c1", 3.6, 5.9); cap("c2", 7.2, 9.4); cap("c3", 10.8, 13.8);
  reveal($("end"), t, 14.6, 15.4); $("end").style.opacity = Math.min(+$("end").style.opacity, 1 - E.in(seg(t, 17.4, 17.8)));
  $("tag").style.opacity = E.out(seg(t, 15.6, 16.2)) * (1 - E.in(seg(t, 17.4, 17.8)));
  // el brazo y el dibujo se apagan para el cierre
  tat.style.opacity = 1 - E.soft(seg(t, 14.0, 14.5));
  $("veil").style.opacity = 0.94 * E.soft(seg(t, 14.0, 14.6));
};
window.render(0);
</script></body></html>
