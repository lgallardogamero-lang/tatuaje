<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/brand.css"><style>

dth="1.8" stroke-linecap="round"/><path d="M256 168 C 291.5 138 305.5 160 319.5 128" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 148 C 224 118 210 140 196 108" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 134 C 288 104 302 126 316 94" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><circle cx="256" cy="104" r="7" fill="none" stroke="#161616" stroke-width="1.8"/></svg></div>
  <div class="big display" id="title">Comenta un tatuaje y te lo pruebo en mi brazo</div>

    <span class="brand"><svg width="30" height="30" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.4" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.6" fill="#a58bff"/></svg><span>Calco</span></span>
  </div>
  <div class="abs" id="fade" style="inset:0;background:#0e1014"></div>
<div style="position:absolute;right:22px;bottom:22px;z-index:99;display:flex;align-items:center;gap:7px;opacity:.9;pointer-events:none"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.4" fill="#a58bff"/></svg><span style="font-family:Gloock,serif;font-size:22px;color:#ece7dc;text-shadow:0 1px 8px rgba(0,0,0,.6)">Calco</span></div></div>
<script src="../lib/anim.js"></script><script>
window.DURATION = 18;
const $ = (id) => document.getElementById(id);
const ink = new Ink($("tat").querySelector("svg"), { boost: 1.7 });
const TEXT = "una ramita fina en el antebrazo";
window.render = (t) => {
  $("fade").style.opacity = Math.max(1 - E.out(seg(t, 0, 0.5)), E.in(seg(t, 17.5, 18)));
  reveal($("title"), t, 0.4, 1.2); $("title").style.opacity = Math.min(+$("title").style.opacity, 1 - seg(t, 14.0, 14.4));
  reveal($("ast"), t, 1.4, 2.0, { dy: 8 }); $("ast").style.opacity = Math.min(+$("ast").style.opacity, 1 - seg(t, 14.0, 14.4));
  // tarjeta del comentario
  const c = $("card"); const p = E.back(seg(t, 2.2, 3.0));
  c.style.opacity = seg(t, 2.2, 2.6) * (1 - E.in(seg(t, 13.8, 14.2))); c.style.transform = `translateY(${(1 - p) * 60}px)`;
  const typedText = typed(TEXT, seg(t, 3.2, 6.0));
  const caret = Math.floor(t * 2.2) % 2 === 0 || seg(t, 3.2, 6.0) < 1;
  $("cm").innerHTML = typedText + (t < 7.0 && caret ? '<span class="caret"></span>' : "");
  // generando
  const g = $("gen"); g.style.opacity = seg(t, 6.4, 6.8) * (1 - seg(t, 7.8, 8.2)); $("bari").style.width = 100 * E.io(seg(t, 6.6, 7.8)) + "%";
  // el tatuaje se calca sobre el brazo
  ink.set(E.io(seg(t, 7.8, 11.0)), E.soft(seg(t, 11.0, 12.0)));
  // votación (sin cifras: invita a comentar)
  const v = $("votes"); v.style.opacity = seg(t, 12.6, 13.0) * (1 - E.in(seg(t, 13.8, 14.2)));
  ["v1", "v2", "v3"].forEach((id, i) => ($(id).style.transform = `scale(${E.back(seg(t, 12.6 + i * 0.25, 13.3 + i * 0.25))})`));
  reveal($("end"), t, 14.6, 15.4); $("end").style.opacity = Math.min(+$("end").style.opacity, 1 - E.in(seg(t, 17.4, 17.8)));
  $("veil").style.opacity = 0.72 * E.soft(seg(t, 14.0, 14.8));
  $("tag").style.opacity = E.out(seg(t, 12.0, 12.6)) * (1 - E.in(seg(t, 17.4, 17.8)));
};
window.render(0);
</script></body></html>
