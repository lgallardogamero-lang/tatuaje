<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/brand.css"><style>
.stage { background:#0e1014; }
.say { position:absolute; left:40px; right:40px; top:90px; font-size:56px; text-shadow:0 2px 18px rgba(0,0,0,.35); }
.paper { position:absolute; left:50px; top:250px; width:440px; height:440px; border-radius:18px; background:#ece7dc; box-shadow:0 24px 60px rgba(0,0,0,.5); }
.tattoo { position:absolute; left:-40px; top:210px; width:620px; height:620px; }
.panel { position:absolute; inset:0; }
.xmark { position:absolute; left:70px; top:230px; width:400px; height:480px; }
.xmark path { stroke:#ece7dc; stroke-width:16; stroke-linecap:round; fill:none; stroke-dasharray:1; stroke-dashoffset:1; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
</style></head><body><div class="stage" style="width:540px;height:960px">
  <div class="panel" id="skinp" style="clip-path:circle(0px at 270px 470px)"><div class="skin"></div><div class="scrim-top"></div></div>
  <div class="paper" id="paper"></div>
  <div class="tattoo" id="tat"><div id="tat1" style="position:absolute;inset:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024"><path d="M256 440 C 90 320 90 170 170 140 C 215 124 245 150 256 180 C 267 150 297 124 342 140 C 422 170 422 320 256 440 Z" fill="#c0392b" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"/><path d="M110 300 L400 270 L412 320 L120 350 Z" fill="#fff" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"/><path d="M180 190 C 190 170 215 168 232 188" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/></svg></div></div>
  <div class="tattoo" id="tat2" style="opacity:0"><div style="position:absolute;inset:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024"><path d="M256 470 C 250 360 270 250 256 110" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 420 C 196 390 182 412 168 380" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 406 C 316 376 330 398 344 366" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 386 C 199.5 356 185.5 378 171.5 346" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 372 C 312.5 342 326.5 364 340.5 332" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 352 C 203 322 189 344 175 312" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 338 C 309 308 323 330 337 298" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 318 C 206.5 288 192.5 310 178.5 278" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 304 C 305.5 274 319.5 296 333.5 264" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 284 C 210 254 196 276 182 244" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 270 C 302 240 316 262 330 230" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 250 C 213.5 220 199.5 242 185.5 210" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 236 C 298.5 206 312.5 228 326.5 196" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 216 C 217 186 203 208 189 176" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 202 C 295 172 309 194 323 162" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 182 C 220.5 152 206.5 174 192.5 142" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 168 C 291.5 138 305.5 160 319.5 128" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 148 C 224 118 210 140 196 108" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><path d="M256 134 C 288 104 302 126 316 94" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round"/><circle cx="256" cy="104" r="7" fill="none" stroke="#161616" stroke-width="1.8"/></svg></div></div>
  <svg class="xmark" id="x" viewBox="0 0 400 480"><path id="x1" d="M40 60 L360 420" pathLength="1"/><path id="x2" d="M360 60 L40 420" pathLength="1"/></svg>
  <div class="say display" id="a">Querías tatuarte esto.</div>
  <div class="say display" id="b" style="opacity:0;font-size:46px">Pero te daba miedo arrepentirte.</div>
  <div class="say display" id="c" style="opacity:0">Así que lo viste puesto.</div>
  <div class="say display" id="d" style="opacity:0">Y cambiaste de idea.</div>
  <div class="say display" id="e" style="opacity:0">Menos mal que lo viste antes.</div>
  <div class="abs" id="endcard" style="inset:0;background:#0e1014;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:0 46px">
    <svg width="96" height="96" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.4" fill="#a58bff"/></svg>
    <div class="display" style="font-size:78px">Calco</div>
    <div class="display" style="font-size:40px;color:#ece7dc;line-height:1.1">Pruébate el tatuaje antes de hacértelo</div>
    <div class="chip violet" style="font-size:20px;margin-top:8px">3 pruebas gratis · enlace en la bio</div>
    <div style="font-size:15px;color:#a3a4ad">Simulación orientativa con IA</div>
  </div>
  <div class="abs chip" id="tag" style="left:40px;bottom:70px;opacity:0">Simulación con IA</div>
  <div class="abs" id="fade" style="inset:0;background:#0e1014"></div>
<div style="position:absolute;right:22px;bottom:22px;z-index:99;display:flex;align-items:center;gap:7px;opacity:.9;pointer-events:none"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 20 L13 4 L22 20 Z" stroke="#a58bff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 20 L13 12 L17.5 20" stroke="#ece7dc" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="4" r="1.4" fill="#a58bff"/></svg><span style="font-family:Gloock,serif;font-size:22px;color:#ece7dc;text-shadow:0 1px 8px rgba(0,0,0,.6)">Calco</span></div></div>
<script src="../lib/anim.js"></script><script>
window.DURATION = 18;
const $ = (id) => document.getElementById(id);
const heart = new Ink($("tat1").querySelector("svg"), { boost: 1.5 });
const rama = new Ink($("tat2").querySelector("svg"), { boost: 1.8 });
const line = (id, t, a, b, o = 0.4) => { const el = $(id); reveal(el, t, a, a + o); el.style.opacity = Math.min(+el.style.opacity, 1 - E.in(seg(t, b, b + 0.35))); };
window.render = (t) => {
  $("fade").style.opacity = Math.max(1 - E.out(seg(t, 0, 0.5)), E.in(seg(t, 17.6, 18)));
  line("a", t, 0.4, 2.7); line("b", t, 2.8, 5.0); line("c", t, 5.4, 8.0); line("d", t, 8.2, 10.4); line("e", t, 10.9, 14.0);
  // 1) el corazón sobre papel
  heart.set(E.io(seg(t, 0.8, 2.4)), E.soft(seg(t, 2.1, 2.9)));
  const shake = t > 2.9 && t < 5.0 ? Math.sin((t - 2.9) * 22) * 3 * Math.min(1, (t - 2.9) * 2) : 0;
  $("paper").style.transform = `rotate(${shake * 0.6}deg)`; $("tat").style.transform = `translateX(${shake}px)`;
  $("paper").style.opacity = 1 - E.soft(seg(t, 5.0, 5.8));
  // 2) la piel entra en círculo y el dibujo se pasa a ella
  $("skinp").style.clipPath = `circle(${E.io(seg(t, 5.0, 6.0)) * 760}px at 270px 470px)`;
  const heartOp = t < 9.6 ? 1 : 1 - E.soft(seg(t, 9.6, 10.4));
  $("tat1").style.opacity = heartOp;
  // 3) la X
  const xp = E.out(seg(t, 8.6, 9.3)); $("x1").style.strokeDashoffset = 1 - Math.min(1, xp * 2); $("x2").style.strokeDashoffset = 1 - Math.max(0, xp * 2 - 1);
  $("x").style.opacity = 1 - E.soft(seg(t, 10.2, 10.8));
  // 4) la rama nueva
  $("tat2").style.opacity = seg(t, 10.9, 11.1) * (t < 14 ? 1 : 1 - E.soft(seg(t, 14.0, 14.5)));
  rama.set(E.io(seg(t, 11.0, 13.2)), E.soft(seg(t, 13.0, 14.0)));
  $("skinp").style.opacity = 1 - E.soft(seg(t, 14.0, 14.6));
  // 5) cierre
  $("endcard").style.opacity = E.soft(seg(t, 14.2, 15.0));
  $("tag").style.opacity = seg(t, 5.6, 6.2) * (1 - seg(t, 14.0, 14.4));
};
window.render(0);
</script></body></html>
